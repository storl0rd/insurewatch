version: "3.9"

# InsureWatch — LAB 4: Full chaos
# Three problems to find and fix:
#   1. collector/skeleton.yml is incomplete — no data reaches Grafana
#   2. claims-service uses B3 propagator — traces break at gateway→claims boundary
#   3. claims-service has no auto-instrumentation or manual spans
#
# Recommended order: fix collector → fix propagator → restore instrumentation

services:
  # ── Observability stack ──────────────────────────────────────────────────────
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: insurewatch-lgtm
    ports:
      - "3100:3000"   # Grafana UI
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── OTel Collector — skeleton config, pipeline incomplete ────────────────────
  collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: insurewatch-collector
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./collector/skeleton.yml:/etc/otelcol/config.yml:ro
    depends_on:
      lgtm:
        condition: service_healthy
    restart: unless-stopped

  # ── Database ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: insurewatch-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    container_name: insurewatch-api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CLAIMS_SERVICE_URL=http://claims-service:3001
      - POLICY_SERVICE_URL=http://policy-service:8080
      - INVESTMENT_SERVICE_URL=http://investment-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - CHAOS_CONTROLLER_URL=http://chaos-controller:3004
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - OTEL_SERVICE_NAME=api-gateway
    depends_on:
      - collector
    restart: unless-stopped

  claims-service:
    build: ./claims-service
    container_name: insurewatch-claims
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URL=mongodb://mongodb:27017
      - POLICY_SERVICE_URL=http://policy-service:8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - OTEL_SERVICE_NAME=claims-service
      - ENVIRONMENT=local
    depends_on:
      mongodb:
        condition: service_healthy
      collector:
        condition: service_started
    restart: unless-stopped

  policy-service:
    build: ./policy-service
    container_name: insurewatch-policy
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGODB_URL=mongodb://mongodb:27017/insurewatch
      - MONGO_DATABASE=insurewatch
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - OTEL_SERVICE_NAME=policy-service
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      mongodb:
        condition: service_healthy
      collector:
        condition: service_started
    restart: unless-stopped

  investment-service:
    build: ./investment-service
    container_name: insurewatch-investment
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGODB_URL=mongodb://mongodb:27017/insurewatch
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - OTEL_SERVICE_NAME=investment-service
    depends_on:
      mongodb:
        condition: service_healthy
      collector:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    container_name: insurewatch-notification
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - OTEL_SERVICE_NAME=notification-service
      - ENVIRONMENT=local
    depends_on:
      - collector
    restart: unless-stopped

  chaos-controller:
    build: ./chaos-controller
    container_name: insurewatch-chaos
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - CLAIMS_SERVICE_URL=http://claims-service:3001
      - POLICY_SERVICE_URL=http://policy-service:8080
      - INVESTMENT_SERVICE_URL=http://investment-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - OTEL_SERVICE_NAME=chaos-controller
    depends_on:
      - collector
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: insurewatch-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_OTEL_ENDPOINT=http://localhost:4318
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  mongo-data:
  lgtm-data:
